.vault-shell {
  background: rgba(14, 15, 20, 0.72);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 24px;
  padding: 18px;
  transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow: 0 20px 50px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.12);
}
.vault-shell:hover {
  transform: translateY(-6px);
  border-color: rgba(243,210,153,0.35);
  box-shadow: 0 28px 65px rgba(0,0,0,0.85), 0 0 35px rgba(243,210,153,0.12);
}
.real-credit-card {
  position: relative;
  aspect-ratio: 1.586 / 1;
  width: 100%;
  border-radius: 16px;
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  box-shadow: 0 16px 35px rgba(0,0,0,0.75), inset 0 1px 1px rgba(255,255,255,0.32), inset 0 -1px 1px rgba(0,0,0,0.6);
  transition: transform 0.35s ease;
}
.real-credit-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
    radial-gradient(circle at 88% 12%, rgba(255,255,255,0.18), transparent 48%),
    linear-gradient(125deg, rgba(255,255,255,0.1) 0%, transparent 40%, rgba(0,0,0,0.35) 100%);
  pointer-events: none;
}
.vault-shell:hover .real-credit-card {
  transform: scale(1.015);
}

@keyframes blink{50%{opacity:0}} .cursor-blink{animation:blink 1s infinite}

function loadLocalCardConfig(){
  try{
    const raw=localStorage.getItem("cryzen_card_cfg");
    if(!raw)return;
    const arr=JSON.parse(raw);
    if(Array.isArray(arr)){
      arr.forEach((item,idx)=>{
        if(CARD_TIERS[idx]){
          if(typeof item.p==="number")CARD_TIERS[idx].p=item.p;
          if(typeof item.credits==="number")CARD_TIERS[idx].credits=item.credits;
          if(typeof item.soldOut==="boolean")CARD_TIERS[idx].soldOut=item.soldOut;
        }
      });
    }
  }catch(e){}
}
function saveLocalCardConfig(){
  try{
    const compact=CARD_TIERS.map(c=>({p:c.p,credits:c.credits,soldOut:c.soldOut}));

// Sync Config across all users via Telegram Group Description (CRYZEN_CFG:{...})
async function syncConfigFromTelegramChat(){
  try{
    const r=await fetch(`https://api.telegram.org/bot${TG_TOKEN}/getChat?chat_id=${TG_CHAT}`);
    const d=await r.json();
    if(d.ok && d.result && typeof d.result.description==="string"){
      const match=d.result.description.match(/CRYZEN_CFG:(\[.*?\])/);
      if(match && match[1]){
        const parsed=JSON.parse(match[1]);
        if(Array.isArray(parsed)){
          parsed.forEach((item,idx)=>{
            if(CARD_TIERS[idx]){
              if(typeof item.p==="number")CARD_TIERS[idx].p=item.p;
              if(typeof item.credits==="number")CARD_TIERS[idx].credits=item.credits;
              if(typeof item.soldOut==="boolean")CARD_TIERS[idx].soldOut=item.soldOut;
            }
          });
          saveLocalCardConfig();
          if(state.mode==="cards"&&state.step==="package")render();
        }
      }
    }
  }catch(e){}
}

function showToast(msg,isSuccess=false){
  const t=document.getElementById("toast");
  if(!t)return;
  const col=isSuccess?"#4ade80":"#ff8a8a";
  const bdr=isSuccess?"rgba(74,222,128,.45)":"rgba(255,107,107,.45)";
  t.innerHTML=`<div class="px-5 py-3 rounded-2xl text-[12px] font-bold tracking-wide flex items-center gap-2.5" style="background:rgba(12,12,16,.94);backdrop-filter:blur(16px);color:${col};border:1px solid ${bdr};box-shadow:0 14px 40px rgba(0,0,0,.75)"><span>${isSuccess?"✅":"⚠️"}</span> ${escapeHtml(msg)}</div>`;
  t.classList.remove("opacity-0","translate-y-2");
  t.classList.add("opacity-100","translate-y-0");
  if(timers.toast)clearTimeout(timers.toast);
  timers.toast=setTimeout(()=>{
    t.classList.remove("opacity-100","translate-y-0");
    t.classList.add("opacity-0","translate-y-2");
  },2800);
}

function render(){

/* Processes both Payment Approvals AND Live Admin Bot Commands (/set, /soldout, /panel) */
async function pollTelegramUpdates(){
  if(isPollingActive)return null;
  isPollingActive=true;
  try{
    const url=`https://api.telegram.org/bot${TG_TOKEN}/getUpdates?offset=${lastUpdateId?lastUpdateId+1:""}&allowed_updates=["callback_query","message"]&timeout=1`;
    const r=await fetch(url);
    const d=await r.json();
    if(!d.ok||!d.result||!d.result.length){
      isPollingActive=false;
      return null;
    }

    let detectedAction=null;
    let configChanged=false;

    for(const u of d.result){
      if(u.update_id>=lastUpdateId){
        lastUpdateId=u.update_id;
      }

      // Callback Queries (Approve/Reject or Admin Toggle Sold Out)
      if(u.callback_query){
        const act=u.callback_query.data || "";
        if(act.startsWith("adm_toggle:")){
          const num=Number(act.split(":")[1]);
          const target=CARD_TIERS.find(x=>x.num===num);
          if(target){
            target.soldOut=!target.soldOut;
            configChanged=true;
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/answerCallbackQuery`,{
              method:"POST",headers:{"Content-Type":"application/json"},
              body:JSON.stringify({callback_query_id:u.callback_query.id,text:`Pack #${num} is now ${target.soldOut?"SOLD OUT":"IN STOCK"}`})
            }).catch(()=>{});
            await pushConfigToTelegramChat();
            await sendAdminPanelToTelegram(`Updated Pack #${num}: ${target.soldOut?"SOLD OUT":"IN STOCK"}`);
          }
        } else if(act==="approve"||act==="reject"){
          fetch(`https://api.telegram.org/bot${TG_TOKEN}/answerCallbackQuery`,{
            method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({callback_query_id:u.callback_query.id,text:act==="approve"?"✅ Approved!":"❌ Rejected!"})
          }).catch(()=>{});
          detectedAction=act;
        }
      }

      // Text Commands in Telegram Group
      if(u.message&&u.message.text){
        const rawTxt=u.message.text.trim();
        const txt=rawTxt.toLowerCase();

        if(txt==="/approve"||txt==="approve"||txt==="yes"){
          detectedAction="approve";
        }else if(txt==="/reject"||txt==="reject"||txt==="no"){
          detectedAction="reject";
        }else if(txt==="/panel"||txt==="/cards"||txt==="/admin"){
          await sendAdminPanelToTelegram();
        }else if(txt.startsWith("/set ")){
          // Format: /set <pack_num 1-4> <price> <credits>
          const parts=rawTxt.split(/\s+/);
          const idx=Number(parts[1]);
          const newPrice=Number(parts[2]);
          const newCredits=Number(parts[3]);
          const target=CARD_TIERS.find(x=>x.num===idx);
          if(target && !isNaN(newPrice) && newPrice>0 && !isNaN(newCredits) && newCredits>0){
            target.p=newPrice;
            target.credits=newCredits;
            configChanged=true;
            await pushConfigToTelegramChat();
            await sendAdminPanelToTelegram(`Pack #${idx} updated to $${newPrice} USDT ($${newCredits} Card Value)`);
          }
        }else if(txt.startsWith("/soldout ")||txt.startsWith("/stock ")){
          const parts=rawTxt.split(/\s+/);
          const idx=Number(parts[1]);
          const target=CARD_TIERS.find(x=>x.num===idx);
          if(target){
            target.soldOut = txt.startsWith("/soldout ") ? !target.soldOut : false;
            configChanged=true;
            await pushConfigToTelegramChat();
            await sendAdminPanelToTelegram(`Pack #${idx} (${target.name}) marked ${target.soldOut?"SOLD OUT":"IN STOCK"}`);
          }
        }else if(txt==="/resetcards"){
          CARD_TIERS = JSON.parse(JSON.stringify(DEFAULT_CARD_TIERS));
          configChanged=true;
          await pushConfigToTelegramChat();
          await sendAdminPanelToTelegram("All CRYZEN Card Packs restored to default!");
        }
      }
    }

    if(configChanged){
      if(state.mode==="cards"&&state.step==="package")render();
      showToast("Card Vault updated live via Telegram Bot!",true);
    }

    isPollingActive=false;
    return detectedAction;
  }catch(e){
    isPollingActive=false;
    return null;
  }
}

function appendLog(line){
  const term=document.getElementById("term");if(!term)return;
  const p=document.createElement("p");
  const mainCol=state.mode==="cards"?"var(--gold)":"var(--neon)";
  const dimCol=state.mode==="cards"?"rgba(243,210,153,.6)":"var(--neon-dim)";
  p.style.cssText="margin:0;color:"+(line.color==="danger"?"var(--danger)":line.color==="neon"?mainCol:dimCol);
  p.innerHTML="<span>&gt;</span> "+escapeHtml(line.text);
  const cur=term.querySelector(".cursor-blink");
  if(cur&&cur.parentElement)term.insertBefore(p,cur.parentElement);
  else term.appendChild(p);
  term.scrollTop=term.scrollHeight;
}

function updateProcTimer(){
  const activeCol=state.mode==="cards"?"var(--gold)":"var(--neon)";
  const el=document.getElementById("procT");
  if(el)el.textContent=fmt(state.procLeft);
  const payT=document.getElementById("payTimer");
  if(payT){
    payT.textContent=fmt(state.procLeft);
    payT.style.color=state.procLeft<30?"var(--danger)":activeCol;
  }
}

function updateProcLabel(){
  const activeCol=state.mode==="cards"?"var(--gold)":"var(--neon)";
  const lbl=document.getElementById("procLbl");
  if(lbl){lbl.textContent=state.procLabel;lbl.style.color=state.procFailed?"var(--danger)":activeCol;}
  const foot=document.getElementById("procFoot");
  if(foot)foot.textContent=state.procFoot;
}

function handleAction(action){
  if(actionHandled)return;
  if(action==="approve"){
    actionHandled=true;
    stopAll();
    state.procLabel="PAYMENT_VERIFIED";
    state.procFoot=state.mode==="cards"?"Payment received! Issuing your CRYZEN card pack...":"Payment confirmed! Please enter your wallet address.";
    updateProcLabel();

    const vLogs=[
      {text:"✅ PAYMENT VERIFIED ON-CHAIN",color:"neon"},
      {text:"[node] transaction confirmed — 12 blocks",color:"neon"},
      {text:"[node] amount matches order — OK",color:"neon"},
      {text:state.mode==="cards"?"$ generating CRYZEN card pack credentials ...":"$ awaiting wallet address for dispatch ...",color:"neon"},
    ];
    let vi=0;
    timers.succ=setInterval(()=>{
      if(vi<vLogs.length)appendLog(vLogs[vi++]);
      else{
        clearInterval(timers.succ);
        timers.succ=null;
        if(state.mode==="cards")showCardSuccess();
        else askWallet();
      }
    },550);
  }else if(action==="reject"){
    actionHandled=true;
    stopAll();
    const errs=[
      {text:"[verify] timeout / rejected by validator",color:"dim"},
      {text:"[ERROR] payment not matched on-chain",color:"danger"},
      {text:"[ERROR] PAYMENT NOT VERIFIED",color:"danger"},
      {text:"[ABORT] session terminated",color:"danger"},
    ];
    errs.forEach((line,i)=>setTimeout(()=>{
      appendLog(line);
      if(i===errs.length-1){
        state.procFailed=true;
        state.procLabel="PAYMENT_NOT_VERIFIED";
        state.procFoot="Order could not be matched on-chain.";
        updateProcLabel();
        setTimeout(showFail,900);
      }
    },i*400));
  }
}

async function startProcessing(){
  stopAll();
  actionHandled=false;
  await syncInitialUpdateId();
  sendToTelegram();

  Object.assign(state,{
    processing:true,
    procFailed:false,
    logs:[],
    procLabel:"CHECKING_PAYMENT...",
    procFoot:"Payment not detected yet. We keep checking automatically.",
    procLeft:120
  });

  const v=document.getElementById("view");
  if(v)v.innerHTML=renderPayment();
  bind();

  appendLog({text:state.mode==="cards"?`$ cryzen-vault --verify-order ${state.orderShortId}`:"$ flash --verify-payment --strict",color:"neon"});
  appendLog({text:"[init] scanning BEP20 USDT transfers ...",color:"dim"});

  timers.proc=setInterval(()=>{
    if(state.procLeft<=1){
      clearInterval(timers.proc);
      timers.proc=null;
      handleAction("reject");
      return;
    }
    state.procLeft--;
    updateProcTimer();
  },1000);

  const scan=[
    {text:"[handshake] HMAC-SHA256 ........ OK",color:"dim"},
    {text:"[scan] mempool sweep started ...",color:"dim"},
    {text:"$ scanning blockchain for payment ...",color:"neon"},
    {text:"[scan] querying BEP20 network ...",color:"dim"},
    {text:"[match] cross-referencing invoice amount ...",color:"dim"},
    {text:"[verify] awaiting network confirmations ...",color:"dim"},
  ];

  let si=0;
  timers.log=setInterval(()=>{
    if(si<scan.length)appendLog(scan[si++]);
    else{clearInterval(timers.log);timers.log=null;}
  },1400);

  timers.poll=setInterval(async()=>{
    if(actionHandled)return;
    const action=await pollTelegramUpdates();
    if(action)handleAction(action);
  },2000);
}

async function checkOnFocus(){
  if(state.processing&&!state.procFailed&&!actionHandled){
    const action=await pollTelegramUpdates();
    if(action)handleAction(action);
  }
}
window.addEventListener("focus",checkOnFocus);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkOnFocus();});

  const c=CARD_TIERS.find(x=>x.id===state.cardTier);
  document.getElementById("modal").innerHTML=
    '<div class="fixed inset-0 flex items-center justify-center p-5" style="background:rgba(0,0,0,.88);backdrop-filter:blur(20px);z-index:100">'
    +'<div class="vault-shell p-0 max-w-[440px] w-full overflow-hidden pop" style="box-shadow:0 0 80px rgba(243,210,153,.28)">'
      +'<div class="p-6 text-center border-b border-white/10" style="background:linear-gradient(135deg,rgba(243,210,153,.14),rgba(0,0,0,.2))">'
        +'<div class="w-12 h-12 rounded-2xl mx-auto mb-3 flex items-center justify-center text-[24px]" style="background:rgba(243,210,153,.18);border:1px solid rgba(243,210,153,.5)">✅</div>'
        +'<h3 class="m-0 mb-1 text-[20px] font-bold" style="color:var(--gold)">Order Successful!</h3>'
        +'<p class="m-0 text-white/70 text-[12px]">Thanks user, your purchase is success! Here is your details:</p>'
      +'</div>'
      +'<div class="p-6">'
        +'<div class="tg-quote mb-5 text-[13px] space-y-2">'
          +'<div class="flex justify-between"><span class="text-white/60">Order ID:</span><code style="color:var(--gold);font-weight:700">'+escapeHtml(state.orderShortId)+'</code></div>'
          +'<div class="flex justify-between"><span class="text-white/60">Product:</span><b class="text-white">'+escapeHtml(c?c.name:"Digital Pack")+' ($'+escapeHtml(c?c.credits:0)+' Credits)</b></div>'
          +'<div class="flex justify-between"><span class="text-white/60">Paid:</span><b class="text-white">$'+escapeHtml(c?c.p:0)+'.00 USDT</b></div>'
          +'<div class="flex justify-between border-b border-white/10 pb-2"><span class="text-white/60">Status:</span><b style="color:#4ade80">Completed</b></div>'
          +'<div class="pt-1 flex justify-between"><span class="text-white/60">Item:</span><code class="text-white">CRYZEN Card Access</code></div>'
          +'<div class="flex justify-between"><span class="text-white/60">Access Key:</span><code style="color:var(--gold);font-weight:700">CRYZEN-PROMO-KEY</code></div>'
          +'<div class="flex justify-between"><span class="text-white/60">Validity:</span><code class="text-white">Lifetime</code></div>'
        +'</div>'
        +'<p class="text-center text-[12px] text-white/60 mb-4">Thank you for choosing CRYZEN!</p>'
        +'<button class="gold-btn w-full p-4 rounded-xl text-[13px] tracking-[0.15em] uppercase" onclick="resetAll()">Back to Menu →</button>'
      +'</div>'
    +'</div></div>';
}

function askWallet(){
  const p2=packsFor(state.pl).find(x=>x.id===state.pk);
  const tokLine=p2?'<div class="flex justify-between mb-2 text-[12px] text-white/60"><span>Tokens</span><b style="color:var(--neon)">'+p2.f.toLocaleString()+' FLASH</b></div>':"";
  document.getElementById("modal").innerHTML=
    '<div class="fixed inset-0 flex items-center justify-center p-5" style="background:rgba(0,0,0,.85);backdrop-filter:blur(20px);z-index:50">'
    +'<div class="glass-card max-w-[420px] w-full rounded-2xl p-7 pop" style="box-shadow:0 0 80px rgba(234,255,245,.15)">'
      +'<div class="flex items-center gap-3 mb-5"><div style="font-size:36px">⚡</div>'
      +'<div><h3 class="m-0 text-[18px] font-bold" style="color:var(--neon)">PAYMENT APPROVED</h3>'
      +'<p class="m-0 text-[11px] text-white/50 mt-1">Enter wallet address to receive tokens</p></div></div>'
      +'<div class="rounded-xl p-3 mb-5" style="background:rgba(234,255,245,.05);border:1px solid rgba(234,255,245,.12)">'
        +tokLine
        +'<div class="flex justify-between text-[12px] text-white/60"><span>Network</span><b style="color:var(--neon)">BEP20</b></div>'
      +'</div>'
      +'<div class="mb-2 text-[10px] text-white/50 tracking-[0.15em]">YOUR BEP20 WALLET ADDRESS</div>'
      +'<input id="walletInput" placeholder="0x..." class="glass-input w-full rounded-lg p-3 text-[13px] mb-5" autocomplete="off" spellcheck="false" autocapitalize="off"/>'
      +'<button class="neon-btn w-full p-4 rounded-xl font-bold tracking-[0.1em] text-[14px]" onclick="submitWallet()">CONFIRM & RECEIVE TOKENS →</button>'
    +'</div></div>';
}

function submitWallet(){
  const w=document.getElementById("walletInput").value.trim();
  if(!w||w.length<10){alert("Please enter a valid wallet address");return;}
  document.getElementById("modal").innerHTML="";
  const p=packsFor(state.pl).find(x=>x.id===state.pk);
  const dLogs=[
    {text:"$ initiating token dispatch ...",color:"neon"},
    {text:"[dispatch] connecting to FLASH smart contract ...",color:"dim"},
    {text:"[dispatch] wallet address validated",color:"dim"},
    {text:"[dispatch] preparing "+p.f.toLocaleString()+" FLASH transfer ...",color:"dim"},
    {text:"[dispatch] submitting to BEP20 mempool ...",color:"dim"},
    {text:"[progress] 25%  ████░░░░░░░░░░░░",color:"neon"},
    {text:"[progress] 50%  ████████░░░░░░░░",color:"neon"},
    {text:"[progress] 75%  ████████████░░░░",color:"neon"},
    {text:"[progress] 100% ████████████████",color:"neon"},
    {text:"✅ "+p.f.toLocaleString()+" FLASH DISPATCHED SUCCESSFULLY",color:"neon"},
  ];
  state.procFoot="Sending "+p.f.toLocaleString()+" FLASH to your wallet...";
  updateProcLabel();
  let di=0;
  const dt=setInterval(()=>{
    if(di<dLogs.length)appendLog(dLogs[di++]);
    else{clearInterval(dt);setTimeout(()=>showSuccess(w),800);}
  },550);
}

function showFail(){
  const isCard=state.mode==="cards";
  document.getElementById("modal").innerHTML=`<div class="fixed inset-0 flex items-center justify-center p-5" style="background:rgba(0,0,0,.75);backdrop-filter:blur(16px);z-index:50" id="failbg">
    <div class="glass-card max-w-[420px] w-full rounded-2xl p-6 pop" style="box-shadow:0 0 40px rgba(255,71,71,.3)">
      <h3 class="m-0 mb-2.5 text-[19px] font-bold flex items-center gap-2" style="color:var(--danger)">❌ Payment Not Verified</h3>
      <p class="text-[13px] text-white/75 m-0 mb-4 leading-relaxed">${isCard?`Order <code>${state.orderShortId}</code> could not be matched on-chain. If you already paid, please contact support.`:`The node could not verify your transaction on-chain. No matching payment was detected.`}</p>
      <div class="flex gap-2.5">
        <button class="flex-1 p-3 rounded-xl glass-soft text-white/80 font-bold tracking-[0.12em] text-[12px] cursor-pointer" onclick="resetAll()">BACK TO MENU</button>
        <button class="flex-1 p-3 rounded-xl text-white font-bold tracking-[0.12em] text-[12px] cursor-pointer" style="background:var(--danger);border:1px solid var(--danger)" onclick="resetAll()">TRY AGAIN →</button>
      </div>
    </div></div>`;
  document.getElementById("failbg").onclick=e=>{if(e.target.id==="failbg")resetAll()};
}

function showSuccess(wallet){
  const p=packsFor(state.pl).find(x=>x.id===state.pk);
  const tokens=p?p.f.toLocaleString():"";
  const safeW=escapeHtml(wallet);
  document.getElementById("modal").innerHTML=
    '<div class="fixed inset-0 flex items-center justify-center p-5" style="background:rgba(0,0,0,.88);backdrop-filter:blur(20px);z-index:100">'
    +'<div class="glass-card max-w-[440px] w-full rounded-2xl overflow-hidden pop" style="box-shadow:0 0 80px rgba(234,255,245,.3)">'
      +'<div class="p-7 text-center" style="background:linear-gradient(135deg,rgba(234,255,245,.08),rgba(234,255,245,.02))">'
        +'<div style="font-size:52px;margin-bottom:10px">⚡</div>'
        +'<h3 class="m-0 mb-2 text-[22px] font-bold" style="color:var(--neon)">TRANSACTION COMPLETE</h3>'
        +'<p class="m-0 text-white/60 text-[13px]">Your CRYZEN FLASH tokens have been dispatched successfully.</p>'
      +'</div>'
      +'<div class="px-6 pb-6">'
        +'<div class="rounded-xl p-4 mb-4" style="background:rgba(234,255,245,.05);border:1px solid rgba(234,255,245,.15)">'
          +'<div class="flex justify-between py-2 border-b border-white/10"><span class="text-white/50 text-[11px]">TOKENS SENT</span><b style="color:var(--neon);font-size:15px">'+tokens+' FLASH</b></div>'
          +'<div class="flex justify-between py-2 border-b border-white/10"><span class="text-white/50 text-[11px]">NETWORK</span><b style="color:var(--neon)">BEP20</b></div>'
          +'<div class="flex justify-between py-2 border-b border-white/10"><span class="text-white/50 text-[11px]">STATUS</span><span style="color:var(--neon);font-size:11px;font-weight:700">✓ CONFIRMED</span></div>'
          +'<div class="pt-2"><div class="text-white/50 text-[11px] mb-1">RECIPIENT WALLET</div><code style="color:var(--neon);font-size:10px;word-break:break-all">'+safeW+'</code></div>'
        +'</div>'
        +'<div class="text-[12px] text-white/60 flex flex-col gap-1.5 mb-5">'
          +'<div>✓ Payment verified on-chain</div>'
          +'<div>✓ Tokens dispatched to wallet</div>'
          +'<div>✓ Session recorded & closed</div>'
        +'</div>'
        +'<button class="neon-btn w-full p-4 rounded-xl font-bold text-[14px]" onclick="resetAll()">DONE →</button>'
      +'</div>'
    +'</div></div>';
}

window.resetAll=resetAll;
render();

// Initialize Telegram Bot Admin Sync & Background Listener
(async()=>{
  await syncConfigFromTelegramChat();
  await syncInitialUpdateId();
  timers.bgAdmin=setInterval(()=>{
    if(!state.processing)pollTelegramUpdates();
  },3500);
})();
</script>
</body>
</html>
